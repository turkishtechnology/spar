server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # HTML files - no cache to always serve fresh content
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # Cache static assets (Docusaurus uses content hashing)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Handle client-side routing
    location / {
        try_files $uri $uri/ $uri/index.html /index.html =404;
        add_header Cache-Control "no-cache";
    }

    # Specific handling for assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Specific handling for docs
    location /docs/ {
        try_files $uri $uri/ $uri/index.html /index.html;
    }

    # Specific handling for translations
    location /tr/ {
        try_files $uri $uri/ $uri/index.html /tr/index.html;
    }
}
