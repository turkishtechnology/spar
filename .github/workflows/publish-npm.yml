name: Publish to NPM

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine dist-tag from tag name
        id: disttag
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG_NAME" == *-* ]]; then
            echo "script=publish:spar:beta" >> "$GITHUB_OUTPUT"
            echo "Prerelease tag detected ($TAG_NAME) -> publishing under 'beta' dist-tag"
          else
            echo "script=publish:spar" >> "$GITHUB_OUTPUT"
            echo "Stable tag detected ($TAG_NAME) -> publishing under 'latest' dist-tag"
          fi

      - name: Publish to NPM
        run: pnpm run ${{ steps.disttag.outputs.script }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
